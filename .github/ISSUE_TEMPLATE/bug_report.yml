name: Bug report
description: Report a reproducible defect with synthetic, redacted evidence.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, account identity, exact quota usage, private prompts, task output, databases, approval files, raw logs, or machine-specific paths. Use the private security route for suspected vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Affected commit or release
      placeholder: Commit SHA or alpha version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Provide macOS, Python, and Codex CLI versions only.
      placeholder: macOS 15.x; Python 3.13.x; Codex CLI 0.x
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe the command, redacted error code, and state transition.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use only synthetic inputs. Do not attach a database or raw log.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed account, usage, credential, prompt, output, path, and runtime-state data.
          required: true
        - label: This is not a vulnerability report.
          required: true
